- name: Creating docker secrets
  shell: "kubectl create secret docker-registry ocir --namespace default --docker-server {{region_key}}.ocir.io  --docker-username {{ create_repo_curl.container_repository.namespace }}/{{ocir_user}} --docker-password '{{ ocir_token }}' --dry-run=client -o=yaml | kubectl apply -f -"

- name: Get OCIR Docker config JSON from Kubernetes secret
  shell: |
    kubectl get secret ocir -n default -o jsonpath='{.data.\.dockerconfigjson}'
  register: ocir_config_encoded

- name: Decode OCIR Docker config JSON
  set_fact:
    ocir_config: "{{ ocir_config_encoded.stdout }}"

- name: Create Vault secrets for mosip_ocir_secret
  oracle.oci.oci_vault_secret:
    compartment_id: "{{ vault_compartment_id }}"
    vault_id: "{{ vault_id }}"
    key_id: "{{ vault_key_id }}"
    secret_name: "mosip_ocir_secret"
    secret_content:
      content_type: BASE64
      content: "{{ ocir_config }}"

- name: Removing k8s secret
  shell: "kubectl -n default delete secret ocir"

- name: Create regclient cert directories
  file:
    path: "{{item}}"
    state: directory
    mode: '0755'
  with_items:
    - /home/opc/regclient-setup


- name: "Copy deployment check script"
  copy:
    src: "{{item}}"
    dest: "/home/opc/regclient-setup/{{item}}"
    mode: "0755"
  with_items:
    - client-openssl.cnf
    - openssl.cnf
    - root-openssl.cnf
    - create-signing-certs.sh

- name: Check if regclient-certs ConfigMap exists
  command: kubectl get cm regclient-certs -n default
  register: regclient_cm
  ignore_errors: yes
  changed_when: false

- name: Create certificates
  shell: |
    bash create-signing-certs.sh {{regclient_keystore_password}}
    kubectl -n default create cm regclient-certs --from-file=./certs/
  args:
    chdir: /home/opc/regclient-setup
  when: regclient_cm.rc != 0

- name: Get keystore.p12 from regclient-certs ConfigMap
  shell: |
    kubectl get cm regclient-certs -n default -o jsonpath='{.binaryData.keystore\.p12}'
  register: keystore_p12
  ignore_errors: yes

- name: Set fact for keystore.p12
  set_fact:
    mosip_regclient_keystore_file: "{{ keystore_p12.stdout }}"

- name: Get Client.crt from regclient-certs ConfigMap
  shell: |
    kubectl get cm regclient-certs -n default -o jsonpath='{.data.Client\.crt}'
  register: clientcrt
  ignore_errors: yes

- name: Set fact for Client.crt
  set_fact:
    mosip_regclient_client_certificate: "{{ clientcrt.stdout | b64encode }}"

- name: Get Client.csr from regclient-certs ConfigMap
  shell: |
    kubectl get cm regclient-certs -n default -o jsonpath='{.data.Client\.csr}'
  register: clientcsr
  ignore_errors: yes

- name: Set fact for Client.csr
  set_fact:
    mosip_regclient_client_csr: "{{ clientcsr.stdout | b64encode  }}"

- name: Get Client.key from regclient-certs ConfigMap
  shell: |
    kubectl get cm regclient-certs -n default -o jsonpath='{.data.Client\.key}'
  register: clientkey
  ignore_errors: yes

- name: Set fact for Client.key
  set_fact:
    mosip_regclient_client_key: "{{ clientkey.stdout | b64encode }}"

- name: Get RootCA.crt from regclient-certs ConfigMap
  shell: |
    kubectl get cm regclient-certs -n default -o jsonpath='{.data.RootCA\.crt}'
  register: rootcacrt
  ignore_errors: yes

- name: Set fact for RootCA.crt
  set_fact:
    mosip_regclient_root_certificate: "{{ rootcacrt.stdout | b64encode }}"

- name: Get RootCA.key from regclient-certs ConfigMap
  shell: |
    kubectl get cm regclient-certs -n default -o jsonpath='{.data.RootCA\.key}'
  register: rootcakey
  ignore_errors: yes

- name: Set fact for RootCA.key
  set_fact:
    mosip_regclient_root_key: "{{ rootcakey.stdout | b64encode }}"


