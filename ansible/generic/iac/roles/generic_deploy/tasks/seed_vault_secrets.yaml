- name: Get region code
  oracle.oci.oci_identity_region_facts:
    name: "{{region}}"
  register: region_code

- name: Convert region key to lowercase and set as fact
  set_fact:
    region_key: "{{ region_code.regions[0].key | lower }}"


- name: Create container_repository for postgresql-client
  oracle.oci.oci_artifacts_container_repository:
    compartment_id: "{{compartment_id}}"
    display_name: mosip{{env}}/postgresql-client
    is_immutable: false
    is_public: false
  register: create_repo_pg_client

- name: Set image full path
  set_fact:
    postgresclient_image: "{{region_key}}.ocir.io/{{ create_repo_pg_client.container_repository.namespace }}/{{ create_repo_pg_client.container_repository.display_name }}"

- name: Pull PostgreSQL Client Docker image and push to ocir
  shell: |
    docker login {{region_key}}.ocir.io --username {{ create_repo_pg_client.container_repository.namespace }}/{{ocir_user}} --password '{{ocir_token}}'
    docker pull jbergknoff/postgresql-client
    docker tag jbergknoff/postgresql-client {{postgresclient_image}}
    docker push {{postgresclient_image}}
  register: docker_pull_result
  changed_when: "'Downloaded newer image' in docker_pull_result.stdout"

- name: Create container_repository for curl
  oracle.oci.oci_artifacts_container_repository:
    compartment_id: "{{compartment_id}}"
    display_name: mosip{{env}}/curl
    is_immutable: false
    is_public: false
  register: create_repo_curl

- name: Set image full path
  set_fact:
    curl_image: "{{region_key}}.ocir.io/{{ create_repo_curl.container_repository.namespace }}/{{ create_repo_curl.container_repository.display_name }}"

- name: Pull Curl Docker image and push to ocir
  shell: |
    docker login {{region_key}}.ocir.io --username {{ create_repo_curl.container_repository.namespace }}/{{ocir_user}} --password '{{ocir_token}}'
    docker pull registry.k8s.io/e2e-test-images/agnhost:2.39
    docker tag registry.k8s.io/e2e-test-images/agnhost:2.39 {{curl_image}}
    docker push {{curl_image}}
  register: docker_pull_result
  changed_when: "'Downloaded newer image' in docker_pull_result.stdout"

- name: Create Vault secrets for mosip_curl_image
  oracle.oci.oci_vault_secret:
