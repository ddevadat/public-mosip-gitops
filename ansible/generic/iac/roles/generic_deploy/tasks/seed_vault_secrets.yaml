- name: Create Vault secrets with random UUID content
  oracle.oci.oci_vault_secret:
    compartment_id: "{{ vault_compartment_id }}"
    vault_id: "{{ vault_id }}"
    key_id: "{{ vault_key_id }}"
    secret_name: "{{ item }}"
    secret_content:
      content_type: BASE64
      content: "{{ mosip_default_client_secret | b64encode }}"
  loop: "{{ secrets_list }}"
  loop_control:
    label: "{{ item }}"
  register: secret_creation_results

