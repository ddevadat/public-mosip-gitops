postgres-init:
  backoffLimit: 6
  jobAnnotations:
    argocd.argoproj.io/sync-wave: "-96"
  dbUserPasswords:
    dbuserPassword: <path:ocivault#mosip_pg_password#latest | base64decode> 

  databases:
    mosip_toolkit:
      enabled: false
    
    mosip_master:
      enabled: false
    
    mosip_audit:
      enabled: false
    
    mosip_keymgr:
      enabled: false
    
    mosip_kernel:
      enabled: false
    
    mosip_idmap:
      enabled: false
    
    mosip_prereg:
      enabled: false
    
    mosip_idrepo:
      enabled: false
    
    mosip_ida:
      enabled: false
    
    mosip_credential:
      enabled: false
    
    mosip_regprc:
      enabled: false
    
    mosip_regdevice:
      enabled: false
    
    mosip_authdevice:
      enabled: false
    
    mosip_pms:
      enabled: false
    
    mosip_hotlist:
      enabled: false
    
    mosip_resident:
      enabled: false
    
    mosip_digitalcard:
      enabled: false

    mosip_mockidentitysystem:
      enabled: false
      host: "postgres-postgresql.postgres"
      branch: develop      
    
    mosip_esignet:
      enabled: false
      host: "postgres-postgresql.postgres"
      branch: v1.4.0

    mosip_otp:
      enabled: true
      host: "postgres-postgresql.postgres"
      port: 5432
      su:
        user: postgres
        secret:
          name: postgres-postgresql
          key: postgres-password
      dml: 0
      repoUrl: https://github.com/mosip/otp-manager.git
      branch: v1.3.0-beta.1

    mosip_certify:
      enabled: true
      host: "postgres-postgresql.postgres"
      port: 5432
      su:
        user: postgres
        secret:
          name: postgres-postgresql
          key: postgres-password
      dml: 1
      repoUrl: https://github.com/mosip/inji-certify.git
      branch: v0.10.2