initcontainer:
  curl_image: <path:ocivault#mosip_curl_image#latest | base64decode> 
  tcp_image: <path:ocivault#mosip_tcp_image#latest | base64decode> 
  imagepullsecret: "ocir"
  artifactory_ns: artifactory


keygen:
  fullnameOverride: "keygen"
  backoffLimit: 6
  springConfigNameEnv: id-authentication
  softHsmCM: softhsm-ida-share

ida-auth:
  fullnameOverride: "ida-auth"

ida-internal:
  fullnameOverride: "ida-internal"

ida-otp:
  fullnameOverride: "ida-otp"