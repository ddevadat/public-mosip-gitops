apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: 'true'
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: 'true'
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "kernel"
  name: artifactory-jdk11-share
  namespace: {{ .Values.namespace }}
data:
  artifactory_url_env: http://artifactory.artifactory-jdk11:80
  auth_wrapper_url_env: http://artifactory.artifactory-jdk11:80/artifactory/libs-release-local/idp/idp-auth-wrapper/authentication-wrapper.jar
  cache_provider_url_env: http://artifactory.artifactory-jdk11:80/artifactory/libs-release-local/cache/cache-provider.jar
  esignet_wrapper_url_env: http://artifactory.artifactory-jdk11:80/artifactory/libs-release-local/esignet/esignet-wrapper.zip
  iam_adapter_regproc_ext_url_env: http://artifactory.artifactory-jdk11:80/artifactory/libs-release-local/io/mosip/kernel/kernel-auth-adapter.jar
  iam_adapter_regproc_url_env: http://artifactory.artifactory-jdk11:80/artifactory/libs-release-local/io/mosip/kernel/kernel-auth-adapter.jar
  iam_adapter_url_env: http://artifactory.artifactory-jdk11:80/artifactory/libs-release-local/io/mosip/kernel/kernel-auth-adapter.jar
  icu4j_url_env: http://artifactory.artifactory-jdk11:80/artifactory/libs-release-local/icu4j/icu4j.jar
