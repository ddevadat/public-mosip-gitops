  kernel_transliteration_icu4j_url_env: http://artifactory.artifactory-jdk11:80/artifactory/libs-release-local/icu4j/kernel-transliteration-icu4j.jar
  preregistration_i18n_bundle_url_env: http://artifactory.artifactory-jdk11:80/artifactory/libs-release-local/i18n/pre-registration-i18n-bundle.zip
  regproc_jars_env: /artifactory/libs-release-local/clamav/kernel-virusscanner-clamav.jar
  residentBundleUrl_env: http://artifactory.artifactory-jdk11:80/artifactory/libs-release-local/i18n/resident-i18n-bundle.zip
  runtime_dep_url_env: http://artifactory.artifactory-jdk11:80/artifactory/libs-release-local/io/mosip/kernel/
